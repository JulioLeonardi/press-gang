name: job-board

on:
  schedule:
    # 11:17 UTC = 7:17 AM US Eastern during EDT, 6:17 AM during EST.
    #
    # Deliberately mid-morning ET rather than the 00:00 UTC this used to be.
    # GitHub cron has no timezone support, so 00:00 UTC is 8 PM ET the *previous
    # evening*: the run on the evening of Aug 25 produced a page stamped
    # "August 26". Mid-morning ET is the same calendar day in both zones all
    # year, so the build date can no longer disagree with the reader's.
    #
    # GitHub also delays scheduled runs on shared runners -- the 00:00 slot was
    # landing at 00:51. Off-the-hour avoids the worst of the queue, and an hour
    # of slippage here still cannot push the run across midnight either way.
    #
    # This is the ONLY thing that rebuilds the page. If the board appears to
    # update twice in a day, check for a manual workflow_dispatch run.
    - cron: "17 11 * * *"
  workflow_dispatch:

# `pages` + `id-token` are what actions/deploy-pages needs. `contents: read`
# only -- unlike check-jobs this workflow never writes back to the repo.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Pages allows one in-flight deployment; cancel a superseded build rather
  # than queueing it. Distinct from the check-jobs group on purpose -- these
  # two touch nothing in common and should never block each other.
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Reads state/seen.json from the checkout to mark rows NEW. That file is
      # committed hourly by check-jobs, so it is at most an hour stale here.
      - name: Render the board
        run: python scripts/render_board.py -o site/index.html --title "Job Board"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
