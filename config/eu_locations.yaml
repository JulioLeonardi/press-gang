# Location matching lists.
#
# NOTE: US detection runs FIRST and wins. This matters because many EU city
# names are also US cities — Dublin CA/OH, Berlin NH, Paris TX, Vienna VA,
# Naples FL, Milan TN, Rome GA, Athens GA. Without US precedence those would
# all false-positive as EU.
#
# The UK is deliberately absent (post-Brexit, not EU).

