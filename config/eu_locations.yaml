# Remote phrasings that imply an EU-eligible remote role.
remote_patterns:
  - remote (eu)
  - remote - eu
  - remote, eu
  - eu remote
  - remote europe
  - europe remote
  - remote (europe)
  - remote emea
  - emea remote
  - anywhere in europe
  - remote within the eu

# NOT in the EU. Kept here so it's a one-line move into `countries`/`cities`
# if you later decide you want them. Off by default.
include_non_eu_european: false
non_eu_european:
  - Switzerland
  - Zurich
  - Geneva
  - Lausanne
  - Basel
  - Norway
  - Oslo
  - Trondheim
  - Iceland
  - Reykjavik

# Explicitly excluded even if they'd otherwise match (UK is out).
exclude_patterns:
  - united kingdom
  - england
  - scotland
  - wales
  - northern ireland
  - london
  - manchester
  - cambridge, uk
  - oxford
  - edinburgh
  - glasgow
  - bristol
  - leeds
  - belfast
  - ", uk"
  - (uk)
