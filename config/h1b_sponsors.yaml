# Companies known to sponsor H-1B visas.
#
# WHY THIS EXISTS
#   The sources' own `sponsorship` field is unusable: across the whole active
#   pool only ~28 US postings carry "Offers Sponsorship" (~0.08/day, and zero
#   in some weeks), while ~99% say "Other", meaning "unspecified". Gating on
#   the field alone makes the bot silent; ignoring it entirely floods the
#   channel with cleared-defense roles. This list is the middle path: a
#   company-level signal for who actually sponsors.
#
# PROVENANCE
#   Seeded from the USCIS H-1B Employer Data Hub, FY2022 + FY2023 combined
#   (https://www.uscis.gov/tools/reports-and-studies/h-1b-employer-data-hub).
#   Employer names were matched against the companies that really appear in
#   the job feeds and then hand-cleaned, because USCIS records legal entities
#   ("AMAZON.COM SERVICES LLC") while postings use trade names ("Amazon").
#   FY2024+ exists only inside a Tableau dashboard with no CSV export, so
#   FY2023 is the newest bulk data available. That is fine here: whether a
#   company sponsors at all is stable year over year, unlike headcount.
#
# HOW MATCHING WORKS
#   Names are normalized (lowercased, de-accented, legal suffixes stripped)
#   and matched exactly OR as a prefix, so "Amazon" catches "Amazon Web
#   Services" and "Amazon Robotics". Prefix-anchored deliberately: a contains
#   match let "Applied Materials" hit "Johns Hopkins Applied Physics
#   Laboratory" during testing. Keep entries as the SHORTEST distinctive form
#   of the name -- "Capital One", not "Capital One Financial Corporation".
#
# WHAT IS DELIBERATELY ABSENT
#   Cleared-defense primes (Northrop Grumman, RTX, L3Harris, CACI, Leidos,
#   Peraton, Noblis, Booz Allen, SAIC, GDIT, Boeing, SpaceX, JHU APL) are
#   omitted even though several appear in USCIS data with small counts. They
#   sponsor at the margins, but nearly all of their new-grad reqs require a
#   clearance or US-person status -- exactly the noise this filter exists to
#   suppress. `exclude_title_patterns` in sources.yaml catches the stragglers.
#
# MAINTENANCE
#   Add a company: put it in the right group, shortest distinctive name.
#   Delete a whole group you don't care about (staffing_and_outsourcing is the
#   usual first cut) -- the loader flattens whatever groups remain.

