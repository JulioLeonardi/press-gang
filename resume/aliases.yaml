# Canonical term -> other spellings that mean the same thing.
# Applied to bank keywords at load time and (later) to JD matching.
# Matching is case-insensitive, so case-only variants are not listed. The
# exception is all-caps or 3-letter-or-shorter spellings ("JS", "Go", "REST"),
# which JD matching treats case-sensitively so "go"/"rest" don't fire.
# Deliberately absent: "CV" (in EU postings it means a resume, not computer
# vision) and "TS" (too many false hits as a bare token).
