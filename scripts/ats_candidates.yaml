# Candidate boards for scripts/ats_coverage.py. Same shape as config/companies.yaml.
#
# Every board here was checked live on 2026-09-14: it returned real postings
# under the right company name. Things found then and left out on purpose:
#
#   No public board found: Amazon, Google, Microsoft, Meta, Apple, Netflix,
#     Uber, Bloomberg, SAP, Klarna, Revolut, Zalando, Booking.com, Glovo,
#     Sourcegraph. (NVIDIA and Personio already reach Aramente via Workday and
#     Welcome to the Jungle.)
#   Same-name impostors: recruitee/google (sample board), recruitee/meta,
#     recruitee/personio (sandbox), smartrecruiters/uber ("Test UAT"),
#     greenhouse/traderepublic (a customer council), greenhouse/wise (US field sales).
#   SmartRecruiters, no adapter: Wise, Delivery Hero. Aramente already has both,
#     and 258 of Wise's Aramente links are keyless WTTJ URLs, so polling it would
#     double-notify.
#   Contentful: 4 roles, all UK/AU sales.
#   bunq (recruitee/bunq): 14 roles, 0 EU CS matches. It was the only Recruitee
#     candidate, so there is no Recruitee parser; re-add both if that changes.

