# Selection fixture: two voices, an optional (priority 3) section, and a page
# budget that only fits it if two bullets make room. Not real resume content.
meta:
  voices: [technical, impact]
  max_chars: 220
  # acme (7.02) + widget (5.15) = 12.17; side costs 2.44, so it fits only
  # after dropping one acme bullet and widget_ml.
  page_lines: 13.0
  category_keywords: [API, CI/CD]

sections:
  - id: acme
    kind: experience
    title: Backend Intern
    org: Acme
    dates: May 2026 – July 2026
    min_bullets: 2
    max_bullets: 3
    bullets:
      - id: acme_db
        fact: Designed 12 PostgreSQL tables behind a Python service.
        facts_locked: ["12", PostgreSQL]
        priority: 1
        variants:
          - id: acme_db.impact
            voice: impact
            text: "Cut query latency by moving 12 tables to PostgreSQL"
            keywords: [PostgreSQL, latency]
          - id: acme_db.technical
            voice: technical
            text: "Designed 12 PostgreSQL tables behind a Python service"
            keywords: [PostgreSQL, Python]
      - id: acme_api
        fact: Built an internal API serving 3 teams.
        facts_locked: ["3"]
        priority: 2
        variants:
          - id: acme_api.impact
            voice: impact
            text: "Unblocked 3 internal teams with a self-serve API"
            keywords: [API]
          - id: acme_api.technical
            voice: technical
            text: "Built a FastAPI service in Docker serving 3 internal teams"
            keywords: [FastAPI, Docker]
          - id: acme_api.technical_rest
            voice: technical
            text: "Shipped a REST API in Python serving 3 internal teams"
            keywords: [REST, Python]
      - id: acme_ci
        fact: Added CI that runs tests on every pull request.
        priority: 2
        variants:
          - id: acme_ci.impact
            voice: impact
            text: "Caught regressions before merge with checks on every pull request"
            keywords: [CI/CD]
          - id: acme_ci.technical
            voice: technical
            text: "Added GitHub Actions CI running Python tests on every pull request"
            keywords: [GitHub Actions, Python, testing]

